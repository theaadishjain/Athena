services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MEMPALACE_PATH=/data/mempalace/palace
      - DATABASE_URL=sqlite+aiosqlite:////data/studyco.db
    volumes:
      # One volume holds both the SQLite DB and the vector store.
      - athena_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle, so it must be an address the
        # *browser* can reach. "http://backend:8000" only resolves inside
        # Docker's network and would break every API call.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env next to docker-compose.yml}
    ports:
      - "3000:3000"
    env_file:
      # Server-side values (e.g. CLERK_SECRET_KEY) are read at runtime.
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  athena_data:
